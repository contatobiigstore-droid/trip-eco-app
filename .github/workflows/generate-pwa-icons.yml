name: Generate PWA icons
on:
  push:
    paths:
      - "trip-eco-logo.jpg"
      - ".github/workflows/generate-pwa-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate Android and iOS icons from official logo
        run: |
          python - <<'PY'
          from PIL import Image
          src=Image.open("trip-eco-logo.jpg").convert("RGB")
          def square(size, inset=0):
              canvas=Image.new("RGB",(size,size),"white")
              inner=size-2*inset
              im=src.copy()
              im.thumbnail((inner,inner),Image.Resampling.LANCZOS)
              x=(size-im.width)//2; y=(size-im.height)//2
              canvas.paste(im,(x,y))
              return canvas
          square(192).save("icon-192.png",optimize=True)
          square(512).save("icon-512.png",optimize=True)
          square(512,64).save("icon-maskable-512.png",optimize=True)
          square(180).save("apple-touch-icon.png",optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png
          git diff --cached --quiet || git commit -m "Gera ícones PNG oficiais Trip Eco"
          git push
